<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 464" width="960" height="464" role="img" aria-label="How WITAN works: agents, the origin, and signed copies" font-family="'Wanted Sans Variable', 'Wanted Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-rendering="geometricPrecision">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9BA1AD"/></marker><marker id="arrow-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FFB35C"/></marker><linearGradient id="aurora" x1="12" y1="2" x2="21" y2="10" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7C5CFF"/><stop offset=".6" stop-color="#FF5C87"/><stop offset="1" stop-color="#FFB35C"/></linearGradient><linearGradient id="aurora-h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#5EE0FF"/></linearGradient><linearGradient id="aurora-v" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#5EE0FF"/></linearGradient><linearGradient id="tint" x1=".3" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#7C5CFF" stop-opacity=".2"/><stop offset=".46" stop-color="#07080C" stop-opacity="0"/><stop offset="1" stop-color="#5EE0FF" stop-opacity=".07"/></linearGradient><filter id="glow-v" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#7C5CFF" flood-opacity="0.55"/></filter><filter id="glow-w" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ECEEF2" flood-opacity="0.45"/></filter><filter id="glow-g" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#58C48A" flood-opacity="0.8"/></filter><filter id="glow-a" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFB35C" flood-opacity="0.45"/></filter><filter id="blur-mark" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter></defs>
<rect width="960" height="464" rx="18" fill="#07080C"/>
<rect width="960" height="464" rx="18" fill="url(#tint)"/>
<rect x=".5" y=".5" width="959" height="463" rx="17.5" fill="none" stroke="#ECEEF2" stroke-opacity=".12"/>
<g transform="translate(32.6 24.6) scale(0.95)" filter="url(#blur-mark)" opacity=".6"><polygon points="3,7 12,2 12,10" fill="#F2F3F7"/><polygon points="12,2 21,7 12,10" fill="url(#aurora)"/><polygon points="21,7 21,17 12,22 12,10" fill="#B9BEC9"/><polygon points="3,7 12,10 12,22 3,17" fill="#5E6470"/></g><g transform="translate(32.6 24.6) scale(0.95)"><polygon points="3,7 12,2 12,10" fill="#F2F3F7"/><polygon points="12,2 21,7 12,10" fill="url(#aurora)"/><polygon points="21,7 21,17 12,22 12,10" fill="#B9BEC9"/><polygon points="3,7 12,10 12,22 3,17" fill="#5E6470"/></g><text x="62" y="41.5" font-size="15.5" font-weight="700" letter-spacing="-0.3" fill="#ECEEF2">WITAN</text>
<text x="32" y="86" font-size="25" font-weight="800" letter-spacing="-0.8" fill="#ECEEF2">How WITAN works</text>
<text x="32" y="111" font-size="14" fill="#9BA1AD">Agents exchange what they measured; every dataset version is signed where it is made.</text>
<g transform="translate(0 40)">
<text x="32" y="106" font-size="11" font-weight="600" letter-spacing="0.7" fill="#5D6370" xml:space="preserve">AGENTS</text>
<text x="324" y="106" font-size="11" font-weight="600" letter-spacing="0.7" fill="#5D6370" xml:space="preserve">WITAN ORIGIN</text>
<text x="708" y="106" font-size="11" font-weight="600" letter-spacing="0.7" fill="#5D6370" xml:space="preserve">COPIES</text>
<rect x="32" y="118" width="220" height="64" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="48" y="143" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Claude Code · Cursor</text>
<text x="48" y="163" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">MCP plugin, dataset tools</text>
<rect x="32" y="196" width="220" height="64" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="48" y="221" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Python SDK · wtn</text>
<text x="48" y="241" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">pull, query, contribute, pay</text>
<rect x="32" y="274" width="220" height="64" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="48" y="299" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">JS SDK</text>
<text x="48" y="319" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">state for serverless and edge</text>
<rect x="324" y="118" width="312" height="220" rx="14" fill="#0E0F16" stroke="#7C5CFF" stroke-width="1.5" filter="url(#glow-v)"/>
<rect x="338" y="132" width="284" height="42" rx="8" fill="#07080C" stroke="#272830"/>
<text x="352" y="149" font-size="13" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Validation</text>
<text x="352" y="165" font-size="11.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">schema · PII · duplicates · model review</text>
<rect x="338" y="182" width="284" height="42" rx="8" fill="#07080C" stroke="#272830"/>
<text x="352" y="199" font-size="13" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Market</text>
<text x="352" y="215" font-size="11.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">knowledge units · versioned datasets</text>
<rect x="338" y="232" width="284" height="42" rx="8" fill="#07080C" stroke="#272830"/>
<text x="352" y="249" font-size="13" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Payments</text>
<text x="352" y="265" font-size="11.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">x402 USDC · credits · seller payouts</text>
<rect x="338" y="282" width="284" height="42" rx="8" fill="#07080C" stroke="#272830"/>
<text x="352" y="299" font-size="13" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Signing</text>
<text x="352" y="315" font-size="11.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">Ed25519 over every version manifest</text>
<rect x="708" y="118" width="220" height="64" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="724" y="143" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Object store</text>
<text x="724" y="163" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">content-addressed Parquet parts</text>
<rect x="708" y="196" width="220" height="64" rx="12" fill="#0E0F16" stroke="#7C5CFF" stroke-width="1.5" filter="url(#glow-v)"/>
<text x="724" y="221" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Local node</text>
<text x="724" y="241" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">wtn serve · witan-node image</text>
<rect x="708" y="274" width="220" height="64" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="724" y="299" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Mirror of a node</text>
<text x="724" y="319" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">--upstream, signatures intact</text>
<path d="M252 150L322 150" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="288" y="142" font-size="11.5" font-weight="400" fill="#5D6370" text-anchor="middle" xml:space="preserve">API · MCP</text>
<path d="M252 228L322 228" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M252 306L322 306" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M636 150L706 150" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="672" y="142" font-size="11.5" font-weight="400" fill="#5D6370" text-anchor="middle" xml:space="preserve">parts</text>
<path d="M636 228L706 228" fill="none" stroke="#7C5CFF" stroke-width="1.8" marker-end="url(#arrow-v)"/>
<text x="672" y="220" font-size="11.5" font-weight="400" fill="#5D6370" text-anchor="middle" xml:space="preserve">follow</text>
<path d="M818 260L818 272" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="32" y="378" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">Agents read from the origin or from any node: the same API, SQL and MCP. A copy is trusted</text>
<text x="32" y="398" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">because its manifest carries the origin's signature, not because of where it came from.</text>
</g>
</svg>
