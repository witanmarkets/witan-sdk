<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 376" width="960" height="376" role="img" aria-label="Origin signatures pass through nodes and mirrors and are verified by clients" font-family="'Wanted Sans Variable', 'Wanted Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-rendering="geometricPrecision">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9BA1AD"/></marker><marker id="arrow-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FFB35C"/></marker><linearGradient id="aurora" x1="12" y1="2" x2="21" y2="10" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7C5CFF"/><stop offset=".6" stop-color="#FF5C87"/><stop offset="1" stop-color="#FFB35C"/></linearGradient><linearGradient id="aurora-h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#5EE0FF"/></linearGradient><linearGradient id="aurora-v" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#5EE0FF"/></linearGradient><linearGradient id="tint" x1=".3" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#7C5CFF" stop-opacity=".2"/><stop offset=".46" stop-color="#07080C" stop-opacity="0"/><stop offset="1" stop-color="#5EE0FF" stop-opacity=".07"/></linearGradient><filter id="glow-v" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#7C5CFF" flood-opacity="0.55"/></filter><filter id="glow-w" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ECEEF2" flood-opacity="0.45"/></filter><filter id="glow-g" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#58C48A" flood-opacity="0.8"/></filter><filter id="glow-a" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFB35C" flood-opacity="0.45"/></filter><filter id="blur-mark" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter></defs>
<rect width="960" height="376" rx="18" fill="#07080C"/>
<rect width="960" height="376" rx="18" fill="url(#tint)"/>
<rect x=".5" y=".5" width="959" height="375" rx="17.5" fill="none" stroke="#ECEEF2" stroke-opacity=".12"/>
<g transform="translate(32.6 24.6) scale(0.95)" filter="url(#blur-mark)" opacity=".6"><polygon points="3,7 12,2 12,10" fill="#F2F3F7"/><polygon points="12,2 21,7 12,10" fill="url(#aurora)"/><polygon points="21,7 21,17 12,22 12,10" fill="#B9BEC9"/><polygon points="3,7 12,10 12,22 3,17" fill="#5E6470"/></g><g transform="translate(32.6 24.6) scale(0.95)"><polygon points="3,7 12,2 12,10" fill="#F2F3F7"/><polygon points="12,2 21,7 12,10" fill="url(#aurora)"/><polygon points="21,7 21,17 12,22 12,10" fill="#B9BEC9"/><polygon points="3,7 12,10 12,22 3,17" fill="#5E6470"/></g><text x="62" y="41.5" font-size="15.5" font-weight="700" letter-spacing="-0.3" fill="#ECEEF2">WITAN</text>
<text x="32" y="86" font-size="25" font-weight="800" letter-spacing="-0.8" fill="#ECEEF2">Signatures travel with the data</text>
<text x="32" y="111" font-size="14" fill="#9BA1AD">Pin the origin's keys once; then check a copy from anywhere, however many hops it took.</text>
<g transform="translate(0 40)">
<rect x="32" y="118" width="196" height="96" rx="12" fill="#0E0F16" stroke="#7C5CFF" stroke-width="1.5" filter="url(#glow-v)"/>
<text x="48" y="143" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Origin</text>
<text x="48" y="163" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">signs each manifest</text>
<text x="48" y="181" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">key k2, endorsed by k1</text>
<rect x="312" y="118" width="196" height="96" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="328" y="143" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Node or mirror</text>
<text x="328" y="163" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">stores, serves copies</text>
<text x="328" y="181" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">signature unchanged</text>
<rect x="592" y="118" width="196" height="96" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="608" y="143" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Your client</text>
<text x="608" y="163" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">pinned k1 (trust add)</text>
<text x="608" y="181" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">follows k1 → k2</text>
<rect x="848" y="118" width="80" height="42" rx="10" fill="#0E0F16" stroke="#7C5CFF" stroke-width="1.5" filter="url(#glow-v)"/>
<text x="888" y="144" font-size="13" font-weight="600" fill="#ECEEF2" text-anchor="middle" xml:space="preserve">verified</text>
<rect x="848" y="172" width="80" height="42" rx="10" fill="#0E0F16" stroke="#FF5C87" stroke-width="1.5"/>
<text x="888" y="190" font-size="12" font-weight="600" fill="#ECEEF2" text-anchor="middle" xml:space="preserve">Signature</text>
<text x="888" y="205" font-size="12" font-weight="600" fill="#ECEEF2" text-anchor="middle" xml:space="preserve">Error</text>
<path d="M228 166L310 166" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="269" y="156" font-size="11.5" font-weight="400" fill="#5D6370" text-anchor="middle" xml:space="preserve">signed</text>
<path d="M508 166L590 166" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="549" y="156" font-size="11.5" font-weight="400" fill="#5D6370" text-anchor="middle" xml:space="preserve">unchanged</text>
<path d="M788 150L846 139" fill="none" stroke="#7C5CFF" stroke-width="1.8" marker-end="url(#arrow-v)"/>
<path d="M788 182L846 193" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="32" y="262" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">Key rotation: the old key endorses the new one, and the endorsement travels inside every signature,</text>
<text x="32" y="282" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">so clients pinned to k1 keep verifying after the origin moves to k2. A revoked key stops counting at once.</text>
<text x="32" y="310" font-size="12" font-weight="400" fill="#5D6370" text-anchor="start" xml:space="preserve" font-family="'DM Mono', 'SFMono-Regular', Consolas, monospace">Python: verify=True or WITAN_VERIFY=1 · JS: manifest(slug, { verify: keys }) · node: wtn serve --verify</text>
</g>
</svg>
