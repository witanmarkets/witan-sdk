<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 498" width="960" height="498" role="img" aria-label="The x402 purchase: a GET answered 402 with a price, retried with a signed USDC transfer, answered 200" font-family="'Wanted Sans Variable', 'Wanted Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-rendering="geometricPrecision">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9BA1AD"/></marker><marker id="arrow-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FFB35C"/></marker><linearGradient id="aurora" x1="12" y1="2" x2="21" y2="10" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7C5CFF"/><stop offset=".6" stop-color="#FF5C87"/><stop offset="1" stop-color="#FFB35C"/></linearGradient><linearGradient id="aurora-h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#5EE0FF"/></linearGradient><linearGradient id="aurora-v" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#5EE0FF"/></linearGradient><linearGradient id="tint" x1=".3" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#7C5CFF" stop-opacity=".2"/><stop offset=".46" stop-color="#07080C" stop-opacity="0"/><stop offset="1" stop-color="#5EE0FF" stop-opacity=".07"/></linearGradient><filter id="glow-v" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#7C5CFF" flood-opacity="0.55"/></filter><filter id="glow-w" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ECEEF2" flood-opacity="0.45"/></filter><filter id="glow-g" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#58C48A" flood-opacity="0.8"/></filter><filter id="glow-a" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFB35C" flood-opacity="0.45"/></filter><filter id="blur-mark" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter></defs>
<rect width="960" height="498" rx="18" fill="#07080C"/>
<rect width="960" height="498" rx="18" fill="url(#tint)"/>
<rect x=".5" y=".5" width="959" height="497" rx="17.5" fill="none" stroke="#ECEEF2" stroke-opacity=".12"/>
<g transform="translate(32.6 24.6) scale(0.95)" filter="url(#blur-mark)" opacity=".6"><polygon points="3,7 12,2 12,10" fill="#F2F3F7"/><polygon points="12,2 21,7 12,10" fill="url(#aurora)"/><polygon points="21,7 21,17 12,22 12,10" fill="#B9BEC9"/><polygon points="3,7 12,10 12,22 3,17" fill="#5E6470"/></g><g transform="translate(32.6 24.6) scale(0.95)"><polygon points="3,7 12,2 12,10" fill="#F2F3F7"/><polygon points="12,2 21,7 12,10" fill="url(#aurora)"/><polygon points="21,7 21,17 12,22 12,10" fill="#B9BEC9"/><polygon points="3,7 12,10 12,22 3,17" fill="#5E6470"/></g><text x="62" y="41.5" font-size="15.5" font-weight="700" letter-spacing="-0.3" fill="#ECEEF2">WITAN</text>
<text x="32" y="86" font-size="25" font-weight="800" letter-spacing="-0.8" fill="#ECEEF2">Payment is the auth</text>
<text x="32" y="111" font-size="14" fill="#9BA1AD">One request, one 402, one signed transfer — and the second request comes back with the goods.</text>
<g transform="translate(0 40)">
<rect x="32" y="96" width="200" height="54" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="48" y="121" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Buyer agent</text>
<text x="48" y="141" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">a wallet with USDC, no account</text>
<rect x="380" y="96" width="200" height="54" rx="12" fill="#0E0F16" stroke="#7C5CFF" stroke-width="1.5" filter="url(#glow-v)"/>
<text x="396" y="121" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">WITAN</text>
<text x="396" y="141" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">the paid endpoint, x402</text>
<rect x="728" y="96" width="200" height="54" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="744" y="121" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Base</text>
<text x="744" y="141" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">USDC settles on-chain</text>
<line x1="132" y1="150" x2="132" y2="392" stroke="#ECEEF2" stroke-opacity=".12" stroke-dasharray="3 5"/>
<line x1="480" y1="150" x2="480" y2="392" stroke="#ECEEF2" stroke-opacity=".12" stroke-dasharray="3 5"/>
<line x1="828" y1="150" x2="828" y2="392" stroke="#ECEEF2" stroke-opacity=".12" stroke-dasharray="3 5"/>
<path d="M140 186L472 186" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="306.0" y="177" font-size="11.5" font-weight="400" fill="#5D6370" text-anchor="middle" xml:space="preserve">1  GET /paid/knowledge?id=…</text>
<path d="M472 228L140 228" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="306.0" y="219" font-size="11.5" font-weight="400" fill="#5D6370" text-anchor="middle" xml:space="preserve">2  402 Payment Required · $0.01 USDC · pay-to · base-sepolia</text>
<path d="M140 270L472 270" fill="none" stroke="#7C5CFF" stroke-width="1.8" marker-end="url(#arrow-v)"/>
<text x="306.0" y="261" font-size="11.5" font-weight="400" fill="#5D6370" text-anchor="middle" xml:space="preserve">3  the same request, with X-PAYMENT: a signed USDC transfer</text>
<path d="M488 312L820 312" fill="none" stroke="#7C5CFF" stroke-width="1.8" marker-end="url(#arrow-v)"/>
<text x="654.0" y="303" font-size="11.5" font-weight="400" fill="#5D6370" text-anchor="middle" xml:space="preserve">4  verify and settle through the facilitator</text>
<path d="M472 354L140 354" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="306.0" y="345" font-size="11.5" font-weight="400" fill="#5D6370" text-anchor="middle" xml:space="preserve">5  200 OK · the unit body</text>
<circle cx="828" cy="352" r="15" fill="#FFB35C" fill-opacity="0.16" stroke="#FFB35C" stroke-width="1.8" filter="url(#glow-a)"/><text x="828" y="357.4" font-size="15.75" font-weight="800" fill="#FFB35C" text-anchor="middle" xml:space="preserve">$</text>
<text x="828" y="386" font-size="11.5" font-weight="600" fill="#FFB35C" text-anchor="middle" xml:space="preserve">USDC moves once</text>
<text x="32" y="422" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">No sign-up, no key, no card: the payment is the auth. The seller's share of every sale accrues at settlement</text>
<text x="32" y="442" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">and is paid out on-chain; a buyer with an agent key can pay from prepaid credits instead.</text>
</g>
</svg>
