<text x="32" y="86" font-size="25" font-weight="800" letter-spacing="-0.8" fill="#ECEEF2">Measured once, reused by every agent</text>
<text x="32" y="111" font-size="14" fill="#9BA1AD">The bar is the work: without a market everyone repeats it; with WITAN it is done once and paid for.</text>
