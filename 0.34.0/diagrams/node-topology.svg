<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="960" height="436" role="img" aria-label="witan-node container topology: agent, node, volume, origin and mirrors" font-family="'Wanted Sans Variable', 'Wanted Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-rendering="geometricPrecision">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9BA1AD"/></marker><marker id="arrow-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FFB35C"/></marker><linearGradient id="aurora" x1="12" y1="2" x2="21" y2="10" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7C5CFF"/><stop offset=".6" stop-color="#FF5C87"/><stop offset="1" stop-color="#FFB35C"/></linearGradient><linearGradient id="aurora-h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#5EE0FF"/></linearGradient><linearGradient id="aurora-v" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#5EE0FF"/></linearGradient><linearGradient id="tint" x1=".3" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#7C5CFF" stop-opacity=".2"/><stop offset=".46" stop-color="#07080C" stop-opacity="0"/><stop offset="1" stop-color="#5EE0FF" stop-opacity=".07"/></linearGradient><filter id="glow-v" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#7C5CFF" flood-opacity="0.55"/></filter><filter id="glow-w" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ECEEF2" flood-opacity="0.45"/></filter><filter id="glow-g" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#58C48A" flood-opacity="0.8"/></filter><filter id="glow-a" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFB35C" flood-opacity="0.45"/></filter><filter id="blur-mark" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter></defs>
<rect width="960" height="436" rx="18" fill="#07080C"/>
<rect width="960" height="436" rx="18" fill="url(#tint)"/>
<rect x=".5" y=".5" width="959" height="435" rx="17.5" fill="none" stroke="#ECEEF2" stroke-opacity=".12"/>
<g transform="translate(32.6 24.6) scale(0.95)" filter="url(#blur-mark)" opacity=".6"><polygon points="3,7 12,2 12,10" fill="#F2F3F7"/><polygon points="12,2 21,7 12,10" fill="url(#aurora)"/><polygon points="21,7 21,17 12,22 12,10" fill="#B9BEC9"/><polygon points="3,7 12,10 12,22 3,17" fill="#5E6470"/></g><g transform="translate(32.6 24.6) scale(0.95)"><polygon points="3,7 12,2 12,10" fill="#F2F3F7"/><polygon points="12,2 21,7 12,10" fill="url(#aurora)"/><polygon points="21,7 21,17 12,22 12,10" fill="#B9BEC9"/><polygon points="3,7 12,10 12,22 3,17" fill="#5E6470"/></g><text x="62" y="41.5" font-size="15.5" font-weight="700" letter-spacing="-0.3" fill="#ECEEF2">WITAN</text>
<text x="32" y="86" font-size="25" font-weight="800" letter-spacing="-0.8" fill="#ECEEF2">witan-node in a container</text>
<text x="32" y="111" font-size="14" fill="#9BA1AD">The origin's dataset API, SQL and MCP, served from a volume; kept current and verified.</text>
<g transform="translate(0 40)">
<rect x="32" y="138" width="200" height="84" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="48" y="163" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Your agent or app</text>
<text x="48" y="183" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">SDK or MCP client</text>
<text x="48" y="201" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">Bearer &lt;token&gt;</text>
<rect x="306" y="106" width="324" height="206" rx="16" fill="none" stroke="#ECEEF2" stroke-opacity=".3" stroke-dasharray="6 5"/>
<text x="322" y="128" font-size="11.5" font-weight="600" fill="#5D6370" text-anchor="start" xml:space="preserve">witan-node container · uid 10001 · read-only root</text>
<rect x="322" y="142" width="292" height="64" rx="12" fill="#0E0F16" stroke="#7C5CFF" stroke-width="1.5" filter="url(#glow-v)"/>
<text x="338" y="167" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">wtn serve :8686</text>
<text x="338" y="187" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">API · SQL (DuckDB) · MCP /mcp</text>
<rect x="322" y="224" width="292" height="72" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="338" y="249" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">/data volume</text>
<text x="338" y="269" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve" font-family="'DM Mono', 'SFMono-Regular', Consolas, monospace">witan-data/  trust.json</text>
<rect x="712" y="118" width="216" height="84" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="728" y="143" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">WITAN origin</text>
<text x="728" y="163" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">pull the latest version</text>
<text x="728" y="181" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">--follow SLUG --verify</text>
<rect x="712" y="226" width="216" height="84" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16" stroke-dasharray="5 4"/>
<text x="728" y="251" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Another node</text>
<text x="728" y="271" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">--upstream mirror</text>
<text x="728" y="289" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">signatures still checked</text>
<path d="M232 176L320 176" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="269" y="168" font-size="11.5" font-weight="400" fill="#5D6370" text-anchor="middle" xml:space="preserve">HTTP · MCP</text>
<path d="M614 164L710 158" fill="none" stroke="#7C5CFF" stroke-width="1.8" marker-end="url(#arrow-v)"/>
<text x="668" y="150" font-size="11.5" font-weight="400" fill="#5D6370" text-anchor="middle" xml:space="preserve">follow</text>
<path d="M614 190L710 256" fill="none" stroke-dasharray="5 4" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="676" y="214" font-size="11.5" font-weight="400" fill="#5D6370" text-anchor="middle" xml:space="preserve">or</text>
<path d="M468 206L468 222" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="32" y="350" font-size="12" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve" font-family="'DM Mono', 'SFMono-Regular', Consolas, monospace">docker run -d -p 127.0.0.1:8686:8686 -e WITAN_NODE_TOKEN=... -v witan-data:/data \</text>
<text x="32" y="370" font-size="12" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve" font-family="'DM Mono', 'SFMono-Regular', Consolas, monospace">  ghcr.io/witanmarkets/witan-node --follow agent-api-observatory --verify</text>
</g>
</svg>
