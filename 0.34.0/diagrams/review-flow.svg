<path d="M480 288C480 360 725 360 725 290" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="602.5" y="356" font-size="11.5" font-weight="400" fill="#5D6370" text-anchor="middle" xml:space="preserve" font-family="'DM Mono', 'SFMono-Regular', Consolas, monospace">supplement → re-check</text>
