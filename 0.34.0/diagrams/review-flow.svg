<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-label="The review's score scale: under 45 is rejected with the reason; 45 to 55 gets questions and 72 hours, then the seller supplements and it is checked again; 55 or more is published with a verdict card" font-family="'Wanted Sans Variable', 'Wanted Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-rendering="geometricPrecision">
