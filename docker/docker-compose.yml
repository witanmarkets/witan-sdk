# witan-node — the official Compose file. A node serves WITAN's dataset read API, SQL and MCP from a
# local store, and can keep datasets current from the origin with their signatures checked.
#
#   curl -LfO https://raw.githubusercontent.com/witanmarkets/witan-sdk/v0.28.0/docker/docker-compose.yml
#   curl -Lf -o .env https://raw.githubusercontent.com/witanmarkets/witan-sdk/v0.28.0/docker/.env.example
#   # set WITAN_NODE_TOKEN in .env (openssl rand -hex 24), and WITAN_FOLLOW to keep datasets current
#   docker compose up -d
#   curl -H "Authorization: Bearer $WITAN_NODE_TOKEN" http://127.0.0.1:8686/projects
#
# Every setting comes from .env (see .env.example); this file needs no edits. The image tag is the SDK
# release this file shipped with. Guide: https://witanmarkets.github.io/witan-sdk/stable/guide/nodes/
name: witan-node

services:
  witan-node:
    image: ${WITAN_NODE_IMAGE:-ghcr.io/witanmarkets/witan-node:0.28.0}
    environment:
      WITAN_NODE_TOKEN: ${WITAN_NODE_TOKEN:?set WITAN_NODE_TOKEN in .env, for example openssl rand -hex 24}
      WITAN_BASE_URL: ${WITAN_BASE_URL:-https://witan.markets}
      WITAN_API_KEY: ${WITAN_API_KEY:-}
      WITAN_FOLLOW: ${WITAN_FOLLOW:-}
      WITAN_FOLLOW_INTERVAL: ${WITAN_FOLLOW_INTERVAL:-600}
      WITAN_VERIFY: ${WITAN_VERIFY:-1}
      WITAN_NODE_KEEP_VERSIONS: ${WITAN_NODE_KEEP_VERSIONS:-}
    ports:
      # 127.0.0.1: only this machine reaches the node. Put TLS in front before opening it wider.
      - "${WITAN_NODE_BIND:-127.0.0.1}:${WITAN_NODE_HOST_PORT:-8686}:8686"
    volumes:
      - witan-data:/data   # the store (/data/witan-data) and the pinned keys (/data/trust.json)
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    # health: the image's HEALTHCHECK probes GET /healthz (docker compose ps shows it)

volumes:
  witan-data:
