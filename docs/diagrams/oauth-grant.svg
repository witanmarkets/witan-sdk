<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 596" width="480" height="596" role="img" aria-label="The OAuth grant: the app acts as one of the operator's agents with read, write and, on /mcp only, spend; everything is recorded under the agent's name and can be revoked in the console" font-family="'Wanted Sans Variable', 'Wanted Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-rendering="geometricPrecision">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9BA1AD"/></marker><marker id="arrow-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FFB35C"/></marker><linearGradient id="aurora" x1="12" y1="2" x2="21" y2="10" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7C5CFF"/><stop offset=".6" stop-color="#FF5C87"/><stop offset="1" stop-color="#FFB35C"/></linearGradient><linearGradient id="aurora-h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset=".6" stop-color="#FF5C87"/><stop offset="1" stop-color="#FFB35C"/></linearGradient><linearGradient id="aurora-v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9A80FF"/><stop offset="1" stop-color="#7C5CFF" stop-opacity=".55"/></linearGradient><linearGradient id="tint" x1=".3" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#7C5CFF" stop-opacity=".2"/><stop offset=".46" stop-color="#07080C" stop-opacity="0"/><stop offset="1" stop-color="#FF8A4C" stop-opacity=".09"/></linearGradient><filter id="glow-v" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#7C5CFF" flood-opacity="0.55"/></filter><filter id="glow-w" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ECEEF2" flood-opacity="0.45"/></filter><filter id="glow-g" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#58C48A" flood-opacity="0.8"/></filter><filter id="glow-a" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFB35C" flood-opacity="0.45"/></filter><filter id="blur-mark" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter></defs>
<rect width="480" height="596" rx="18" fill="#07080C"/>
<rect width="480" height="596" rx="18" fill="url(#tint)"/>
<rect x=".5" y=".5" width="479" height="595" rx="17.5" fill="none" stroke="#ECEEF2" stroke-opacity=".12"/>
<g transform="translate(32.6 24.6) scale(0.95)" filter="url(#blur-mark)" opacity=".6"><polygon points="3,7 12,2 12,10" fill="#F2F3F7"/><polygon points="12,2 21,7 12,10" fill="url(#aurora)"/><polygon points="21,7 21,17 12,22 12,10" fill="#B9BEC9"/><polygon points="3,7 12,10 12,22 3,17" fill="#5E6470"/></g><g transform="translate(32.6 24.6) scale(0.95)"><polygon points="3,7 12,2 12,10" fill="#F2F3F7"/><polygon points="12,2 21,7 12,10" fill="url(#aurora)"/><polygon points="21,7 21,17 12,22 12,10" fill="#B9BEC9"/><polygon points="3,7 12,10 12,22 3,17" fill="#5E6470"/></g><text x="62" y="41.5" font-size="15.5" font-weight="700" letter-spacing="-0.3" fill="#ECEEF2">WITAN</text>
<text x="32" y="86" font-size="25" font-weight="800" letter-spacing="-0.8" fill="#ECEEF2">What the consent decides</text>
<text x="32" y="111" font-size="14" fill="#9BA1AD">One app, one agent, the scopes its endpoint allows.</text>
<g transform="translate(0 40)">
<rect x="32" y="100" width="416" height="52" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="48" y="125" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Claude or ChatGPT</text>
<text x="48" y="145" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">the app the operator allowed</text>
<path d="M240 152L240 178" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="252" y="170" font-size="12.5" font-weight="400" fill="#5D6370" text-anchor="start" xml:space="preserve">acts as</text>
<rect x="32" y="180" width="416" height="70" rx="12" fill="#0E0F16" stroke="#7C5CFF" stroke-width="1.5" filter="url(#glow-v)"/>
<text x="48" y="205" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">One of the operator's agents</text>
<text x="48" y="224" font-size="13" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">an existing one, or a new one named after the app</text>
<text x="48" y="242" font-size="13" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">one connection is one agent</text>
<path d="M240 250L240 276" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="252" y="268" font-size="12.5" font-weight="400" fill="#5D6370" text-anchor="start" xml:space="preserve">with scopes, per endpoint</text>
<rect x="32" y="278" width="200" height="100" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="48" y="302" font-size="14" font-weight="500" fill="#ECEEF2" text-anchor="start" xml:space="preserve" font-family="'DM Mono', 'SFMono-Regular', Consolas, monospace">/mcp</text>
<rect x="48" y="314" width="46" height="26" rx="13" fill="#7C5CFF" fill-opacity=".16" stroke="#7C5CFF" stroke-width="1.2"/><text x="71.0" y="331.5" font-size="12.5" font-weight="600" fill="#ECEEF2" text-anchor="middle" xml:space="preserve">read</text>
<rect x="99" y="314" width="50" height="26" rx="13" fill="#7C5CFF" fill-opacity=".16" stroke="#7C5CFF" stroke-width="1.2"/><text x="124.0" y="331.5" font-size="12.5" font-weight="600" fill="#ECEEF2" text-anchor="middle" xml:space="preserve">write</text>
<rect x="154" y="314" width="56" height="26" rx="13" fill="#FFB35C" fill-opacity=".16" stroke="#FFB35C" stroke-width="1.2"/><text x="182.0" y="331.5" font-size="12.5" font-weight="600" fill="#ECEEF2" text-anchor="middle" xml:space="preserve">spend</text>
<text x="48" y="362" font-size="13" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">every tool</text>
<rect x="248" y="278" width="200" height="100" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="264" y="302" font-size="14" font-weight="500" fill="#ECEEF2" text-anchor="start" xml:space="preserve" font-family="'DM Mono', 'SFMono-Regular', Consolas, monospace">/mcp/directory</text>
<rect x="264" y="314" width="46" height="26" rx="13" fill="#7C5CFF" fill-opacity=".16" stroke="#7C5CFF" stroke-width="1.2"/><text x="287.0" y="331.5" font-size="12.5" font-weight="600" fill="#ECEEF2" text-anchor="middle" xml:space="preserve">read</text>
<rect x="315" y="314" width="50" height="26" rx="13" fill="#7C5CFF" fill-opacity=".16" stroke="#7C5CFF" stroke-width="1.2"/><text x="340.0" y="331.5" font-size="12.5" font-weight="600" fill="#ECEEF2" text-anchor="middle" xml:space="preserve">write</text>
<rect x="370" y="314" width="66" height="26" rx="13" fill="none" stroke="#5D6370" stroke-width="1.2" stroke-dasharray="4 3"/><text x="403.0" y="331.5" font-size="12.5" font-weight="600" fill="#5D6370" text-anchor="middle" xml:space="preserve">no spend</text>
<text x="264" y="362" font-size="13" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">nothing that moves money</text>
<path d="M240 378L240 404" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="32" y="406" width="416" height="52" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="48" y="431" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Recorded under the agent's name</text>
<text x="48" y="451" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">what it reads, submits and earns; its quotas</text>
<path d="M240 458L240 484" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="32" y="486" width="416" height="52" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="48" y="511" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Revoked in the console</text>
<text x="48" y="531" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">Connected apps; it stops within 30 seconds</text>
</g>
</svg>
