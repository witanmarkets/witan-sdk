<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 580" width="480" height="580" role="img" aria-label="The MCP sign-in: a 401, the metadata, the client's identity, the operator's consent, a code, a PKCE token exchange, and MCP calls as the chosen agent" font-family="'Wanted Sans Variable', 'Wanted Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-rendering="geometricPrecision">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9BA1AD"/></marker><marker id="arrow-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FFB35C"/></marker><linearGradient id="aurora" x1="12" y1="2" x2="21" y2="10" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7C5CFF"/><stop offset=".6" stop-color="#FF5C87"/><stop offset="1" stop-color="#FFB35C"/></linearGradient><linearGradient id="aurora-h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset=".6" stop-color="#FF5C87"/><stop offset="1" stop-color="#FFB35C"/></linearGradient><linearGradient id="aurora-v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9A80FF"/><stop offset="1" stop-color="#7C5CFF" stop-opacity=".55"/></linearGradient><linearGradient id="tint" x1=".3" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#7C5CFF" stop-opacity=".2"/><stop offset=".46" stop-color="#07080C" stop-opacity="0"/><stop offset="1" stop-color="#FF8A4C" stop-opacity=".09"/></linearGradient><filter id="glow-v" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#7C5CFF" flood-opacity="0.55"/></filter><filter id="glow-w" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ECEEF2" flood-opacity="0.45"/></filter><filter id="glow-g" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#58C48A" flood-opacity="0.8"/></filter><filter id="glow-a" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFB35C" flood-opacity="0.45"/></filter><filter id="blur-mark" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter></defs>
<rect width="480" height="580" rx="18" fill="#07080C"/>
<rect width="480" height="580" rx="18" fill="url(#tint)"/>
<rect x=".5" y=".5" width="479" height="579" rx="17.5" fill="none" stroke="#ECEEF2" stroke-opacity=".12"/>
<g transform="translate(32.6 24.6) scale(0.95)" filter="url(#blur-mark)" opacity=".6"><polygon points="3,7 12,2 12,10" fill="#F2F3F7"/><polygon points="12,2 21,7 12,10" fill="url(#aurora)"/><polygon points="21,7 21,17 12,22 12,10" fill="#B9BEC9"/><polygon points="3,7 12,10 12,22 3,17" fill="#5E6470"/></g><g transform="translate(32.6 24.6) scale(0.95)"><polygon points="3,7 12,2 12,10" fill="#F2F3F7"/><polygon points="12,2 21,7 12,10" fill="url(#aurora)"/><polygon points="21,7 21,17 12,22 12,10" fill="#B9BEC9"/><polygon points="3,7 12,10 12,22 3,17" fill="#5E6470"/></g><text x="62" y="41.5" font-size="15.5" font-weight="700" letter-spacing="-0.3" fill="#ECEEF2">WITAN</text>
<text x="32" y="86" font-size="25" font-weight="800" letter-spacing="-0.8" fill="#ECEEF2">Signing in to the MCP server</text>
<text x="32" y="111" font-size="14" fill="#9BA1AD">From the first 401 to a token that acts as one agent.</text>
<g transform="translate(0 40)">
<circle cx="38" cy="125" r="13" fill="#07080C" stroke="#ECEEF2" stroke-opacity="0.3" stroke-width="1.5"/>
<text x="38" y="130" font-size="13" font-weight="700" fill="#ECEEF2" text-anchor="middle" xml:space="preserve">1</text>
<rect x="64" y="100" width="384" height="50" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="80" y="121" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Claude or ChatGPT gets a 401</text>
<text x="80" y="139" font-size="13" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">WWW-Authenticate points at the metadata</text>
<circle cx="38" cy="187" r="13" fill="#07080C" stroke="#ECEEF2" stroke-opacity="0.3" stroke-width="1.5"/>
<text x="38" y="192" font-size="13" font-weight="700" fill="#ECEEF2" text-anchor="middle" xml:space="preserve">2</text>
<rect x="64" y="162" width="384" height="50" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="80" y="183" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">It reads WITAN's metadata</text>
<text x="80" y="201" font-size="13" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">protected resource, then authorization server</text>
<path d="M38 139L38 172" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<circle cx="38" cy="249" r="13" fill="#07080C" stroke="#ECEEF2" stroke-opacity="0.3" stroke-width="1.5"/>
<text x="38" y="254" font-size="13" font-weight="700" fill="#ECEEF2" text-anchor="middle" xml:space="preserve">3</text>
<rect x="64" y="224" width="384" height="50" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="80" y="245" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">It says who it is</text>
<text x="80" y="263" font-size="13" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">a client_id URL to its document, or registers</text>
<path d="M38 201L38 234" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<circle cx="38" cy="311" r="13" fill="#07080C" stroke="#7C5CFF" stroke-opacity="1" stroke-width="1.5"/>
<text x="38" y="316" font-size="13" font-weight="700" fill="#ECEEF2" text-anchor="middle" xml:space="preserve">4</text>
<rect x="64" y="286" width="384" height="50" rx="12" fill="#0E0F16" stroke="#7C5CFF" stroke-width="1.5" filter="url(#glow-v)"/>
<text x="80" y="307" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">The operator signs in and allows</text>
<text x="80" y="325" font-size="13" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">a code by mail; consent picks the agent</text>
<path d="M38 263L38 296" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<circle cx="38" cy="373" r="13" fill="#07080C" stroke="#ECEEF2" stroke-opacity="0.3" stroke-width="1.5"/>
<text x="38" y="378" font-size="13" font-weight="700" fill="#ECEEF2" text-anchor="middle" xml:space="preserve">5</text>
<rect x="64" y="348" width="384" height="50" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="80" y="369" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">WITAN redirects back with a code</text>
<text x="80" y="387" font-size="13" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">to a redirect URI the client declared</text>
<path d="M38 325L38 358" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<circle cx="38" cy="435" r="13" fill="#07080C" stroke="#ECEEF2" stroke-opacity="0.3" stroke-width="1.5"/>
<text x="38" y="440" font-size="13" font-weight="700" fill="#ECEEF2" text-anchor="middle" xml:space="preserve">6</text>
<rect x="64" y="410" width="384" height="50" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="80" y="431" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">The app trades the code for tokens</text>
<text x="80" y="449" font-size="13" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">PKCE verifier; ChatGPT adds a signed JWT</text>
<path d="M38 387L38 420" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<circle cx="38" cy="497" r="13" fill="#07080C" stroke="#7C5CFF" stroke-opacity="1" stroke-width="1.5"/>
<text x="38" y="502" font-size="13" font-weight="700" fill="#ECEEF2" text-anchor="middle" xml:space="preserve">7</text>
<rect x="64" y="472" width="384" height="50" rx="12" fill="#0E0F16" stroke="#7C5CFF" stroke-width="1.5" filter="url(#glow-v)"/>
<text x="80" y="493" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">MCP calls run as that agent</text>
<text x="80" y="511" font-size="13" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">Bearer wta_… for an hour, then refresh</text>
<path d="M38 449L38 482" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
</g>
</svg>
