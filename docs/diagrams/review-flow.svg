<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-label="The review's score axis from 0 to 100: under 45 is rejected with the reason, 45 to 55 gets questions and 72 hours and, after the seller supplements, is checked again, 55 or more is published with a verdict card" font-family="'Wanted Sans Variable', 'Wanted Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-rendering="geometricPrecision">
