<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 526" width="480" height="526" role="img" aria-label="The review: a submission gets code checks and a score; 55 or more is published with a verdict card, 45 to 55 gets questions and 72 hours, under 45 is rejected" font-family="'Wanted Sans Variable', 'Wanted Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-rendering="geometricPrecision">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9BA1AD"/></marker><marker id="arrow-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FFB35C"/></marker><linearGradient id="aurora" x1="12" y1="2" x2="21" y2="10" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7C5CFF"/><stop offset=".6" stop-color="#FF5C87"/><stop offset="1" stop-color="#FFB35C"/></linearGradient><linearGradient id="aurora-h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#5EE0FF"/></linearGradient><linearGradient id="aurora-v" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#5EE0FF"/></linearGradient><linearGradient id="tint" x1=".3" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#7C5CFF" stop-opacity=".2"/><stop offset=".46" stop-color="#07080C" stop-opacity="0"/><stop offset="1" stop-color="#5EE0FF" stop-opacity=".07"/></linearGradient><filter id="glow-v" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#7C5CFF" flood-opacity="0.55"/></filter><filter id="glow-w" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ECEEF2" flood-opacity="0.45"/></filter><filter id="glow-g" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#58C48A" flood-opacity="0.8"/></filter><filter id="glow-a" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFB35C" flood-opacity="0.45"/></filter><filter id="blur-mark" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter></defs>
<rect width="480" height="526" rx="18" fill="#07080C"/>
<rect width="480" height="526" rx="18" fill="url(#tint)"/>
<rect x=".5" y=".5" width="479" height="525" rx="17.5" fill="none" stroke="#ECEEF2" stroke-opacity=".12"/>
<g transform="translate(32.6 24.6) scale(0.95)" filter="url(#blur-mark)" opacity=".6"><polygon points="3,7 12,2 12,10" fill="#F2F3F7"/><polygon points="12,2 21,7 12,10" fill="url(#aurora)"/><polygon points="21,7 21,17 12,22 12,10" fill="#B9BEC9"/><polygon points="3,7 12,10 12,22 3,17" fill="#5E6470"/></g><g transform="translate(32.6 24.6) scale(0.95)"><polygon points="3,7 12,2 12,10" fill="#F2F3F7"/><polygon points="12,2 21,7 12,10" fill="url(#aurora)"/><polygon points="21,7 21,17 12,22 12,10" fill="#B9BEC9"/><polygon points="3,7 12,10 12,22 3,17" fill="#5E6470"/></g><text x="62" y="41.5" font-size="15.5" font-weight="700" letter-spacing="-0.3" fill="#ECEEF2">WITAN</text>
<text x="32" y="86" font-size="25" font-weight="800" letter-spacing="-0.8" fill="#ECEEF2">Ask before rejecting</text>
<text x="32" y="111" font-size="14" fill="#9BA1AD">Three outcomes, with a question band in the middle.</text>
<g transform="translate(0 40)">
<rect x="32" y="100" width="416" height="52" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="48" y="125" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">A unit is submitted</text>
<text x="48" y="145" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">the seller's text</text>
<path d="M240 152L240 178" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="32" y="180" width="416" height="62" rx="12" fill="#0E0F16" stroke="#7C5CFF" stroke-width="1.5" filter="url(#glow-v)"/>
<text x="48" y="205" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Code checks, then the review</text>
<text x="48" y="224" font-size="13" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">numbers recomputed by code; a model reads and scores</text>
<path d="M224 242L96 274" fill="none" stroke="#7C5CFF" stroke-width="1.8" marker-end="url(#arrow-v)"/>
<path d="M240 242L240 274" fill="none" stroke="#7C5CFF" stroke-width="1.8" marker-end="url(#arrow-v)"/>
<path d="M256 242L384 274" fill="none" stroke="#7C5CFF" stroke-width="1.8" marker-end="url(#arrow-v)"/>
<rect x="32" y="276" width="128" height="108" rx="12" fill="#0E0F16" stroke="#58C48A" stroke-width="1.5"/>
<text x="48" y="301" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">55 or more</text>
<text x="48" y="321" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">Published</text>
<text x="48" y="339" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">with a</text>
<text x="48" y="357" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">verdict card</text>
<rect x="176" y="276" width="128" height="108" rx="12" fill="#0E0F16" stroke="#FFB35C" stroke-width="1.5"/>
<text x="192" y="301" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">45 to 55</text>
<text x="192" y="321" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">Questions and</text>
<text x="192" y="339" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">72 hours</text>
<text x="192" y="357" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">(needs_info)</text>
<rect x="320" y="276" width="128" height="108" rx="12" fill="#0E0F16" stroke="#FF5C87" stroke-width="1.5"/>
<text x="336" y="301" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Under 45</text>
<text x="336" y="321" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">Rejected</text>
<text x="336" y="339" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">with the</text>
<text x="336" y="357" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">reason</text>
<path d="M240 384L240 412" fill="none" stroke-dasharray="5 4" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="112" y="414" width="256" height="52" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16" stroke-dasharray="5 4"/>
<text x="128" y="439" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Seller sends a revision</text>
<text x="128" y="459" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">checked again; two rounds</text>
</g>
</svg>
