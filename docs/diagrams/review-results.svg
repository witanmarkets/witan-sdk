<rect x="196" y="120" width="168" height="22" rx="6" fill="#5D6370"/>
<text x="372" y="136" font-size="13.5" font-weight="700" fill="#ECEEF2" text-anchor="start" xml:space="preserve">7</text>
<text x="32" y="170" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">With the 45 to 55 band</text>
<rect x="196" y="154" width="24" height="22" rx="6" fill="url(#aurora-h)"/>
<text x="228" y="170" font-size="13.5" font-weight="700" fill="#ECEEF2" text-anchor="start" xml:space="preserve">1</text>
<text x="32" y="216" font-size="11" font-weight="600" letter-spacing="0.7" fill="#5D6370" xml:space="preserve">V2 SCORER</text>
<text x="32" y="246" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">Cut at 55</text>
<rect x="196" y="230" width="240" height="22" rx="6" fill="#5D6370"/>
<text x="444" y="246" font-size="13.5" font-weight="700" fill="#ECEEF2" text-anchor="start" xml:space="preserve">10</text>
<text x="32" y="280" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">With the 45 to 55 band</text>
<rect x="196" y="264" width="24" height="22" rx="6" fill="url(#aurora-h)"/>
<text x="228" y="280" font-size="13.5" font-weight="700" fill="#ECEEF2" text-anchor="start" xml:space="preserve">1</text>
<text x="32" y="332" font-size="13" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">Honest control units rejected, on the same cases for both columns.</text>
<text x="32" y="352" font-size="13" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">192 synthetic cases; runs differ by about two. Nothing extra was published.</text>
