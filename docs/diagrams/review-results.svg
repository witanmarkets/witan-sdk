<text x="32" y="86" font-size="25" font-weight="800" letter-spacing="-0.8" fill="#ECEEF2">False rejections</text>
<text x="32" y="111" font-size="14" fill="#9BA1AD">Honest units rejected on our synthetic set, before and after.</text>
<g transform="translate(0 40)">
<text x="32" y="106" font-size="11" font-weight="600" letter-spacing="0.7" fill="#5D6370" xml:space="preserve">V1 SCORER</text>
