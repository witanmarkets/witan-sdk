<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="960" height="436" role="img" aria-label="A sale with payment splits: the buyer pays the item's ownerless split address, distribute() pays the seller, the contributors by record weight and WITAN's fee, which is 0% on testnet" font-family="'Wanted Sans Variable', 'Wanted Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-rendering="geometricPrecision">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9BA1AD"/></marker><marker id="arrow-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FFB35C"/></marker><linearGradient id="aurora" x1="12" y1="2" x2="21" y2="10" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7C5CFF"/><stop offset=".6" stop-color="#FF5C87"/><stop offset="1" stop-color="#FFB35C"/></linearGradient><linearGradient id="aurora-h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#5EE0FF"/></linearGradient><linearGradient id="aurora-v" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#5EE0FF"/></linearGradient><linearGradient id="tint" x1=".3" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#7C5CFF" stop-opacity=".2"/><stop offset=".46" stop-color="#07080C" stop-opacity="0"/><stop offset="1" stop-color="#5EE0FF" stop-opacity=".07"/></linearGradient><filter id="glow-v" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#7C5CFF" flood-opacity="0.55"/></filter><filter id="glow-w" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ECEEF2" flood-opacity="0.45"/></filter><filter id="glow-g" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#58C48A" flood-opacity="0.8"/></filter><filter id="glow-a" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFB35C" flood-opacity="0.45"/></filter><filter id="blur-mark" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter></defs>
<rect width="960" height="436" rx="18" fill="#07080C"/>
<rect width="960" height="436" rx="18" fill="url(#tint)"/>
<rect x=".5" y=".5" width="959" height="435" rx="17.5" fill="none" stroke="#ECEEF2" stroke-opacity=".12"/>
<g transform="translate(32.6 24.6) scale(0.95)" filter="url(#blur-mark)" opacity=".6"><polygon points="3,7 12,2 12,10" fill="#F2F3F7"/><polygon points="12,2 21,7 12,10" fill="url(#aurora)"/><polygon points="21,7 21,17 12,22 12,10" fill="#B9BEC9"/><polygon points="3,7 12,10 12,22 3,17" fill="#5E6470"/></g><g transform="translate(32.6 24.6) scale(0.95)"><polygon points="3,7 12,2 12,10" fill="#F2F3F7"/><polygon points="12,2 21,7 12,10" fill="url(#aurora)"/><polygon points="21,7 21,17 12,22 12,10" fill="#B9BEC9"/><polygon points="3,7 12,10 12,22 3,17" fill="#5E6470"/></g><text x="62" y="41.5" font-size="15.5" font-weight="700" letter-spacing="-0.3" fill="#ECEEF2">WITAN</text>
<text x="32" y="86" font-size="25" font-weight="800" letter-spacing="-0.8" fill="#ECEEF2">Paying a split</text>
<text x="32" y="111" font-size="14" fill="#9BA1AD">The buyer pays the item's own address; a fixed rule pays the rest.</text>
<g transform="translate(0 40)">
<rect x="32" y="170" width="200" height="64" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="48" y="195" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Buyer agent</text>
<text x="48" y="215" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">pays the 402's payTo</text>
<path d="M236 202L376 202" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="306" y="194" font-size="11.5" font-weight="400" fill="#5D6370" text-anchor="middle" xml:space="preserve">pays USDC</text>
<circle cx="306" cy="160" r="14" fill="#FFB35C" fill-opacity="0.16" stroke="#FFB35C" stroke-width="1.8" filter="url(#glow-a)"/><text x="306" y="165.04" font-size="14.700000000000001" font-weight="800" fill="#FFB35C" text-anchor="middle" xml:space="preserve">$</text>
<rect x="380" y="150" width="230" height="104" rx="12" fill="#0E0F16" stroke="#7C5CFF" stroke-width="1.5" filter="url(#glow-v)"/>
<text x="396" y="175" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">The item's split</text>
<text x="396" y="195" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">no owner · a fixed rule</text>
<text x="396" y="232" font-size="12" font-weight="400" fill="#5D6370" text-anchor="start" xml:space="preserve" font-family="'DM Mono', 'SFMono-Regular', Consolas, monospace">0xSplits PushSplit</text>
<text x="662" y="112" font-size="11.5" font-weight="400" fill="#5D6370" text-anchor="middle" xml:space="preserve" font-family="'DM Mono', 'SFMono-Regular', Consolas, monospace">distribute()</text>
<path d="M612 176L724 132" fill="none" stroke="#7C5CFF" stroke-width="1.8" marker-end="url(#arrow-v)"/>
<path d="M612 202L724 228" fill="none" stroke="#7C5CFF" stroke-width="1.8" marker-end="url(#arrow-v)"/>
<path d="M612 228L724 324" fill="none" stroke="#7C5CFF" stroke-width="1.8" marker-end="url(#arrow-v)"/>
<rect x="728" y="100" width="200" height="64" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="744" y="125" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Seller</text>
<text x="744" y="145" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">the rest</text>
<rect x="728" y="196" width="200" height="64" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="744" y="221" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Contributors</text>
<text x="744" y="241" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">by record weight</text>
<rect x="728" y="292" width="200" height="64" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16" stroke-dasharray="5 4"/>
<text x="744" y="317" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">WITAN fee</text>
<text x="744" y="337" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">0% on testnet</text>
<text x="32" y="392" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">No WITAN wallet in the path: the split has no owner, so nobody can redirect it.</text>
</g>
</svg>
