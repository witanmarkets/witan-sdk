<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 412" width="960" height="412" role="img" aria-label="Two ways to pay a seller: a platform wallet owned by WITAN that pays when WITAN decides, or the item's own split with no owner that pays by a rule anyone can read before paying" font-family="'Wanted Sans Variable', 'Wanted Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-rendering="geometricPrecision">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9BA1AD"/></marker><marker id="arrow-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FFB35C"/></marker><linearGradient id="aurora" x1="12" y1="2" x2="21" y2="10" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7C5CFF"/><stop offset=".6" stop-color="#FF5C87"/><stop offset="1" stop-color="#FFB35C"/></linearGradient><linearGradient id="aurora-h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#5EE0FF"/></linearGradient><linearGradient id="aurora-v" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#5EE0FF"/></linearGradient><linearGradient id="tint" x1=".3" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="#7C5CFF" stop-opacity=".2"/><stop offset=".46" stop-color="#07080C" stop-opacity="0"/><stop offset="1" stop-color="#5EE0FF" stop-opacity=".07"/></linearGradient><filter id="glow-v" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#7C5CFF" flood-opacity="0.55"/></filter><filter id="glow-w" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ECEEF2" flood-opacity="0.45"/></filter><filter id="glow-g" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#58C48A" flood-opacity="0.8"/></filter><filter id="glow-a" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFB35C" flood-opacity="0.45"/></filter><filter id="blur-mark" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter></defs>
<rect width="960" height="412" rx="18" fill="#07080C"/>
<rect width="960" height="412" rx="18" fill="url(#tint)"/>
<rect x=".5" y=".5" width="959" height="411" rx="17.5" fill="none" stroke="#ECEEF2" stroke-opacity=".12"/>
<g transform="translate(32.6 24.6) scale(0.95)" filter="url(#blur-mark)" opacity=".6"><polygon points="3,7 12,2 12,10" fill="#F2F3F7"/><polygon points="12,2 21,7 12,10" fill="url(#aurora)"/><polygon points="21,7 21,17 12,22 12,10" fill="#B9BEC9"/><polygon points="3,7 12,10 12,22 3,17" fill="#5E6470"/></g><g transform="translate(32.6 24.6) scale(0.95)"><polygon points="3,7 12,2 12,10" fill="#F2F3F7"/><polygon points="12,2 21,7 12,10" fill="url(#aurora)"/><polygon points="21,7 21,17 12,22 12,10" fill="#B9BEC9"/><polygon points="3,7 12,10 12,22 3,17" fill="#5E6470"/></g><text x="62" y="41.5" font-size="15.5" font-weight="700" letter-spacing="-0.3" fill="#ECEEF2">WITAN</text>
<text x="32" y="86" font-size="25" font-weight="800" letter-spacing="-0.8" fill="#ECEEF2">Custody or a split</text>
<text x="32" y="111" font-size="14" fill="#9BA1AD">Who holds the money between the buyer and the seller.</text>
<g transform="translate(0 40)">
<rect x="148" y="100" width="200" height="56" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="164" y="125" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Buyer pays</text>
<text x="164" y="145" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">USDC</text>
<path d="M248 156L248 196" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="32" y="198" width="432" height="150" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="52" y="230" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Platform wallet</text>
<text x="52" y="250" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">who holds the money, and who decides</text>
<rect x="52" y="272" width="112" height="26" rx="13" fill="#9BA1AD" fill-opacity=".16" stroke="#9BA1AD" stroke-width="1.2"/><text x="108.0" y="289.5" font-size="12.5" font-weight="600" fill="#ECEEF2" text-anchor="middle" xml:space="preserve">owner: WITAN</text>
<rect x="172" y="272" width="170" height="26" rx="13" fill="#9BA1AD" fill-opacity=".16" stroke="#9BA1AD" stroke-width="1.2"/><text x="257.0" y="289.5" font-size="12.5" font-weight="600" fill="#ECEEF2" text-anchor="middle" xml:space="preserve">pays: when we decide</text>
<text x="52" y="332" font-size="12.5" font-weight="400" fill="#5D6370" text-anchor="start" xml:space="preserve">one key, one operator</text>
<rect x="612" y="100" width="200" height="56" rx="12" fill="#0E0F16" fill-opacity=".86" stroke="#ECEEF2" stroke-opacity=".16"/>
<text x="628" y="125" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">Buyer pays</text>
<text x="628" y="145" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">USDC</text>
<path d="M712 156L712 196" fill="none" stroke="#9BA1AD" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="496" y="198" width="432" height="150" rx="12" fill="#0E0F16" stroke="#7C5CFF" stroke-width="1.5" filter="url(#glow-v)"/>
<text x="516" y="230" font-size="14.5" font-weight="600" fill="#ECEEF2" text-anchor="start" xml:space="preserve">The item's split</text>
<text x="516" y="250" font-size="12.5" font-weight="400" fill="#9BA1AD" text-anchor="start" xml:space="preserve">who holds the money, and who decides</text>
<rect x="516" y="272" width="100" height="26" rx="13" fill="#7C5CFF" fill-opacity=".16" stroke="#7C5CFF" stroke-width="1.2"/><text x="566.0" y="289.5" font-size="12.5" font-weight="600" fill="#ECEEF2" text-anchor="middle" xml:space="preserve">owner: none</text>
<rect x="624" y="272" width="150" height="26" rx="13" fill="#7C5CFF" fill-opacity=".16" stroke="#7C5CFF" stroke-width="1.2"/><text x="699.0" y="289.5" font-size="12.5" font-weight="600" fill="#ECEEF2" text-anchor="middle" xml:space="preserve">pays: by the rule</text>
<text x="516" y="332" font-size="12.5" font-weight="400" fill="#5D6370" text-anchor="start" xml:space="preserve">readable before paying</text>
</g>
</svg>
