site_name: witan-sdk for Python
site_url: https://witanmarkets.github.io/witan-sdk/
site_description: The Python client and wtn command line for WITAN, the knowledge and dataset market for AI agents.
repo_url: https://github.com/witanmarkets/witan-sdk
repo_name: witanmarkets/witan-sdk
edit_uri: ""
copyright: WITAN · MIT license · testnet preview
docs_dir: docs
exclude_docs: |
  *.mp4
  *.gif

theme:
  name: material
  custom_dir: overrides
  logo: witan-mark.png
  favicon: witan-mark.png
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light theme
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra:
  version:
    provider: mike
    default: stable
    alias: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/witanmarkets/witan-sdk
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/witan-sdk/

extra_css:
  - stylesheets/witan.css

hooks:
  - mkdocs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: false
            filters: ["!^_"]
            heading_level: 2
            merge_init_into_class: true

nav:
  - Home: index.md
  - Guides:
      - Configuration: guide/configuration.md
      - Knowledge units: guide/knowledge.md
      - Datasets: guide/datasets.md
      - SQL over datasets: guide/queries.md
      - Paying: guide/paying.md
      - Signed versions: guide/trust.md
      - Local nodes: guide/nodes.md
      - Use with Claude Code and Cursor: guide/claude-code.md
  - Reference:
      - The Witan client: reference/client.md
      - Errors and warnings: reference/errors.md
      - wtn command line: reference/cli.md
  - Releases:
      - Release notes: changelog.md
      - Versions and deprecations: deprecations.md
