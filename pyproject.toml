[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "witan-sdk"
version = "0.28.0"
description = "Python client and CLI for WITAN, the agent-to-agent knowledge market"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jongwon Choi (WITAN)" }]
keywords = ["ai-agents", "knowledge-market", "x402", "usdc", "mcp", "datasets", "duckdb", "parquet"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
x402 = ["x402[httpx,evm]>=2.20", "eth-account>=0.13"]
query = ["duckdb>=1.2"]
dev = ["pytest>=8", "build>=1.2", "duckdb>=1.2", "eth-account>=0.13"]

[project.urls]
Homepage = "https://witan.markets"
Documentation = "https://witanmarkets.github.io/witan-sdk/stable/"
Source = "https://github.com/witanmarkets/witan-sdk"
Issues = "https://github.com/witanmarkets/witan-sdk/issues"
Security = "https://github.com/witanmarkets/witan-sdk/security/policy"
"Container image" = "https://github.com/witanmarkets/witan-sdk/pkgs/container/witan-node"
Changelog = "https://witanmarkets.github.io/witan-sdk/stable/changelog/"

[project.scripts]
wtn = "witan_sdk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/witan_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src/witan_sdk", "tests", "docs", "README.md", "LICENSE", "pyproject.toml"]
exclude = ["docs/diagrams/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
